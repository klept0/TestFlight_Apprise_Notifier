services:
  testflight-notifier:
    build: .
    container_name: testflight-notifier
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Override .env settings if needed
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8080
      - TZ=America/New_York  # Set your timezone
      # The dashboard is exposed on 0.0.0.0 here, so protect it with auth.
      # Set these (e.g. in .env) to require an HTTP Basic login:
      # - WEB_USERNAME=admin
      # - WEB_PASSWORD=change-me
    # The container runs as a non-root user (uid 10001). For the in-app config
    # editor to write the mounted .env, ensure the host files are writable by
    # that uid, e.g. `chown 10001 .env data` (or set `user:` to match yours).
    volumes:
      # Mount .env read-write so the in-app config editor and add/remove
      # ID/URL features can persist changes back to the host file.
      - ./.env:/app/.env
      # Optional: Persistent data directory
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/api/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
